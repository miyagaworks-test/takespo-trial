# GitHub 側の秘密の検査
# main への PR ごとに、PR で足された記録を、今の .gitleaks.toml の決まりで検査する。
# 見つかったら失敗にする。main のルールで、このチェック（gitleaks）が通らない PR は取り込めないようにする。
#
# gitleaks は版を固定し、公開されているチェックサムと合うことを確かめてから動かす。
#   版：8.30.1（https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1）
#   チェックサム：同じ版の gitleaks_8.30.1_checksums.txt の linux_x64 の行
# actions/checkout は、タグではなく commit で固定する（v7.0.1 の commit）。

name: 秘密の検査

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: リポジトリを取り出す（PR の範囲を見るため、記録を全部）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks を取り、チェックサムを確かめる
        run: |
          set -euo pipefail
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${file}" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${file}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${file}" -C "${RUNNER_TEMP}" gitleaks

      - name: PR で足された記録を検査する
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/gitleaks" git . \
            --config .gitleaks.toml \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --redact \
            --verbose \
            --no-banner
